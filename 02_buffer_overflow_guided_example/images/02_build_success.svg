<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="398" viewBox="0 0 1200 398">
 <rect width="1200" height="100%" rx="18" fill="#111827"/>
 <rect width="1200" height="64" rx="18" fill="#1F2937"/>
 <circle cx="32" cy="32" r="9" fill="#F87171"/><circle cx="60" cy="32" r="9" fill="#FBBF24"/><circle cx="88" cy="32" r="9" fill="#34D399"/>
 <text x="120" y="40" font-family="Arial" font-size="22" fill="#E5E7EB">Compile both versions — example output</text>
 <style>.cmd{font:700 22px 'DejaVu Sans Mono',monospace;fill:#60A5FA}.out{font:20px 'DejaVu Sans Mono',monospace;fill:#E5E7EB}</style>
 <text x="34" y="112" class="cmd">$ make clean</text>
<text x="34" y="143" class="out">rm -f vulnerable protected crash_input.txt</text>
<text x="34" y="174" class="cmd">$ make</text>
<text x="34" y="205" class="out">gcc -Wall -Wextra -g -fno-stack-protector -no-pie -o vulnerable overflow_demo.c</text>
<text x="34" y="236" class="out">gcc -Wall -Wextra -g -fstack-protector-all -D_FORTIFY_SOURCE=2 -O2 -o protected overflow_demo.c</text>
<text x="34" y="267" class="cmd">$ ls -l vulnerable protected</text>
<text x="34" y="298" class="out">-rwxr-xr-x ... protected</text>
<text x="34" y="329" class="out">-rwxr-xr-x ... vulnerable</text>
 <text x="34" y="378" font-family="Arial" font-size="17" fill="#9CA3AF">Your architecture, paths, addresses, and messages may differ.</text>
</svg>