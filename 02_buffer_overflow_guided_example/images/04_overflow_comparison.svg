 <circle cx="32" cy="32" r="9" fill="#F87171"/><circle cx="60" cy="32" r="9" fill="#FBBF24"/><circle cx="88" cy="32" r="9" fill="#34D399"/>
 <text x="120" y="40" font-family="Arial" font-size="22" fill="#E5E7EB">Vulnerable and protected comparison — example output</text>
 <style>.cmd{font:700 22px 'DejaVu Sans Mono',monospace;fill:#60A5FA}.out{font:20px 'DejaVu Sans Mono',monospace;fill:#E5E7EB}</style>
 <text x="34" y="112" class="cmd">$ python3 make_input.py</text>
<text x="34" y="143" class="out">Created crash_input.txt with 80 A characters</text>
<text x="34" y="174" class="cmd">$ ./vulnerable "$(cat crash_input.txt)"</text>
